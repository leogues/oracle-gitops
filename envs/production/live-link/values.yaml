fullnameOverride: live-link
telemetry:
  enabled: true
image:
  repository: leogues/video-chat-backend
  tag: "56"
service:
  port: 8080
livenessProbe: null
readinessProbe: null
autoscaling:
  enabled: true
  maxReplicas: 2
httpRoute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: default
    namespace: gateway-system
    sectionName: https
  hostnames:
  - live.leogues.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/
env:
  secretName: live-link-secret
