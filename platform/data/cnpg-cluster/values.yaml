nameOverride: postgres

cluster:

  instances: 1

  storage:
    size: 5Gi
    storageClass: longhorn

  # Observability is disabled for the single-node Always Free cluster.
  # monitoring:
  #   enabled: true
  #   podMonitor:
  #     enabled: true

  superuserSecret: superuser-secret

  initdb:
    database: postgres
    owner: dev
    secret:
      name: user-secret
    postInitSQL:
      - CREATE SCHEMA IF NOT EXISTS webrtc AUTHORIZATION dev;
      - CREATE SCHEMA IF NOT EXISTS musichub AUTHORIZATION dev;
