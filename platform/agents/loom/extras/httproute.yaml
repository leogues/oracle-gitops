apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom
  namespace: loom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default
      namespace: gateway-system
      sectionName: https
  hostnames:
    - loom.leogues.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: loom
          port: 7777
          weight: 1
