apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom
  namespace: loom
spec:
  parentRefs:
    - name: default
      namespace: gateway-system
      sectionName: https
  hostnames:
    - loom.leogues.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: loom
          port: 7777
