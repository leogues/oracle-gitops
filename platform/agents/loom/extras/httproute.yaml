apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loom
  namespace: loom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default
      namespace: gateway-system
      sectionName: https
  hostnames:
    - loom.leogues.com
  rules:
    # Public probes receive the application's generic API 404. Kubernetes probes use the pod directly.
    - matches:
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /v1/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/public-health-disabled
      backendRefs:
        - group: ""
          kind: Service
          name: loom
          port: 7777
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: loom
          port: 7777
          weight: 1
