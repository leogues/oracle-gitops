apiVersion: batch/v1
kind: Job
metadata:
  name: loom-migration-preflight-1-3-0
  namespace: loom
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom
        app.kubernetes.io/instance: loom
        app.kubernetes.io/component: migration-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: ghcr.io/clickhouse/loom@sha256:de44a3df7af74392c8fe149c360fa1d9c2f27ac579dd1a82ddaacbb99e373b5c
          command: [loom, migrate, --dry-run, --strict]
          env:
            - name: LOOM_CH_HOST
              value: telemetry-clickhouse-headless.monitoring.svc.cluster.local
            - name: LOOM_CH_PORT
              value: "8123"
            - name: LOOM_CH_SECURE
              value: "false"
            - name: LOOM_CH_USER
              value: loom
            - name: LOOM_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: LOOM_CH_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
