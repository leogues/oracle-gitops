apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-analyst-provisioning
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loom-analyst-provisioning
  namespace: loom
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [loom-secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loom-analyst-provisioning
  namespace: loom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loom-analyst-provisioning
subjects:
  - kind: ServiceAccount
    name: loom-analyst-provisioning
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loom-analyst-provisioning-1-3-0
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 420
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: loom-analyst-provisioning
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: ghcr.io/clickhouse/loom@sha256:de44a3df7af74392c8fe149c360fa1d9c2f27ac579dd1a82ddaacbb99e373b5c
          command: [python, -c]
          args:
            - |
              import base64
              import json
              import os
              import signal
              import ssl
              import subprocess
              import time
              from pathlib import Path
              from urllib.error import HTTPError
              from urllib.request import Request, urlopen

              from server.insights.domain.observation_policy import observer_policies_allow

              POLICY = (
                  "CREATE ROW POLICY loom_own ON system.processes FOR SELECT "
                  "USING user IN ('loom', 'loom_reader') TO loom"
              )
              SHOW_POLICY = "SHOW CREATE ROW POLICY loom_own ON system.processes FORMAT TSVRaw"
              CHECK_GRANT = "CHECK GRANT SELECT ON system.processes"

              def loom_secret():
                  identity = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                  request = Request(
                      "https://kubernetes.default.svc/api/v1/namespaces/loom/secrets/loom-secrets",
                      headers={"Authorization": "Bearer " + (identity / "token").read_text().strip()},
                  )
                  context = ssl.create_default_context(cafile=str(identity / "ca.crt"))
                  with urlopen(request, context=context, timeout=10) as response:
                      data = json.load(response)["data"]
                  return {key: base64.b64decode(data[key]).decode() for key in (
                      "LOOM_CH_PASSWORD", "LOOM_JWT_SECRET"
                  )}

              def sql(statement, user="default", password=None):
                  if password is None:
                      password = os.environ["LOOM_CH_PASSWORD"]
                  request = Request(
                      f"http://{os.environ['LOOM_CH_HOST']}:8123/?wait_end_of_query=1",
                      data=statement.encode(),
                      headers={"X-ClickHouse-User": user, "X-ClickHouse-Key": password},
                  )
                  with urlopen(request, timeout=8) as response:
                      return response.read().decode().strip()

              def loom_reads_processes(password):
                  result = sql(CHECK_GRANT, "loom", password)
                  if result not in {"0", "1"}:
                      raise RuntimeError("Could not verify Loom's process grant")
                  return result == "1"

              def install_policy():
                  sql(POLICY.replace("CREATE ROW POLICY", "CREATE ROW POLICY IF NOT EXISTS", 1))
                  if sql(SHOW_POLICY) != POLICY:
                      raise RuntimeError("Refusing to grant process access without the expected policy")
                  sql("GRANT SELECT ON system.processes TO loom")

              def drain_existing_reads():
                  def active_queries():
                      return set(json.loads(sql(
                          "SELECT groupArray(query_id) FROM system.processes "
                          "WHERE user = 'loom' FORMAT JSONCompactEachRow"
                      ))[0])

                  remaining = active_queries()
                  deadline = time.monotonic() + 20
                  while remaining and time.monotonic() < deadline:
                      time.sleep(0.25)
                      remaining &= active_queries()
                  if remaining:
                      raise RuntimeError("Existing Loom queries did not drain")

              def stop(signum, frame):
                  raise SystemExit(128 + signum)

              signal.signal(signal.SIGTERM, stop)
              secret = loom_secret()
              loom_password = secret["LOOM_CH_PASSWORD"]
              environment = os.environ | {"LOOM_JWT_SECRET": secret["LOOM_JWT_SECRET"]}
              policies = sql("SHOW CREATE ROW POLICIES FORMAT TSVRaw").splitlines()

              if not loom_reads_processes(loom_password):
                  # Recover a prior attempt interrupted after revoking access.
                  install_policy()
                  policies = sql("SHOW CREATE ROW POLICIES FORMAT TSVRaw").splitlines()

              if POLICY not in policies or not loom_reads_processes(loom_password):
                  raise RuntimeError("The deployed process policy or grant differs from GitOps")
              remaining_policies = tuple(policy for policy in policies if policy != POLICY)
              if not observer_policies_allow(remaining_policies, "loom"):
                  raise RuntimeError("An additional policy prevents complete writer observation")

              own_query = "SELECT countIf(query_id = currentQueryID()) FROM system.processes"
              if sql(own_query) != "1" or sql(
                  own_query, "grafana", os.environ["GRAFANA_CH_PASSWORD"]
              ) != "1":
                  raise RuntimeError("The existing policy also restricts another process reader")
              environment.pop("GRAFANA_CH_PASSWORD")

              try:
                  sql("REVOKE SELECT ON system.processes FROM loom")
                  if loom_reads_processes(loom_password):
                      raise RuntimeError("Loom retains an inherited process grant")
                  try:
                      sql("SELECT count() FROM system.processes", "loom", loom_password)
                  except HTTPError as error:
                      if error.headers.get("X-ClickHouse-Exception-Code") != "497":
                          raise
                  else:
                      raise RuntimeError("Loom can still read process rows")
                  drain_existing_reads()
                  sql("DROP ROW POLICY loom_own ON system.processes")
                  subprocess.run(["loom", "ch-setup", "--apply-analyst-sql"],
                                 env=environment, timeout=120, check=True)
              finally:
                  for attempt in range(3):
                      try:
                          install_policy()
                          if not loom_reads_processes(loom_password):
                              raise RuntimeError("Loom's original process grant was not restored")
                          break
                      except Exception:
                          if attempt == 2:
                              raise
                          time.sleep(2)
              print("Analyst provisioned and original process policy verified", flush=True)
          env:
            - name: LOOM_CH_HOST
              value: telemetry-clickhouse-headless.monitoring.svc.cluster.local
            - name: LOOM_CH_PORT
              value: "8123"
            - name: LOOM_CH_SECURE
              value: "false"
            - name: LOOM_CH_USER
              value: default
            - name: LOOM_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: admin-password
            - name: GRAFANA_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: reader-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
