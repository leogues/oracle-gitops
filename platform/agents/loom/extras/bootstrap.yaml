apiVersion: v1
kind: ConfigMap
metadata:
  name: loom-clickhouse-bootstrap
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  bootstrap.sql: |
    CREATE DATABASE IF NOT EXISTS loom ENGINE = Atomic;
    CREATE DATABASE IF NOT EXISTS loom_telemetry ENGINE = Atomic;

    CREATE SETTINGS PROFILE IF NOT EXISTS loom SETTINGS
      max_threads = 1, max_memory_usage = 536870912,
      enable_quantized_codec = 1, allow_suspicious_codecs = 1;
    CREATE USER IF NOT EXISTS loom IDENTIFIED WITH sha256_hash BY {password_hash:String}
      SETTINGS PROFILE loom;
    GRANT ALL ON loom.* TO loom;
    GRANT ALL ON loom_telemetry.* TO loom;
    GRANT SELECT ON system.columns, SELECT ON system.databases,
      SELECT ON system.merge_tree_settings, SELECT ON system.mutations,
      SELECT ON system.one, SELECT ON system.replicas, SELECT ON system.settings,
      SELECT ON system.tables, SELECT ON system.asynchronous_inserts,
      SELECT ON system.data_skipping_indices, SELECT ON system.events,
      SELECT ON system.merges, SELECT ON system.part_log, SELECT ON system.parts,
      SELECT ON system.processes, SELECT ON system.query_log,
      SELECT ON system.view_refreshes, SELECT ON system.zookeeper_connection TO loom;
    CREATE ROW POLICY IF NOT EXISTS loom_own ON system.query_log, system.processes
      USING user IN ('loom', 'loom_reader') TO loom;

    CREATE SETTINGS PROFILE IF NOT EXISTS loom_reader SETTINGS
      readonly = 2,
      max_execution_time = 30 MIN 0.05 MAX 30,
      max_memory_usage = 536870912 MIN 1 MAX 536870912,
      max_rows_to_read = 50000000 MIN 1 MAX 50000000,
      read_overflow_mode = 'throw' CONST;
    CREATE USER IF NOT EXISTS loom_reader IDENTIFIED WITH sha256_hash BY {password_hash:String}
      SETTINGS PROFILE loom_reader;
    GRANT SELECT ON loom.* TO loom_reader;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loom-clickhouse-bootstrap-v1
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: clickhouse/clickhouse-server:26.10.2.103
          command: [/bin/bash, -ec]
          args:
            - |
              exec clickhouse-client --host telemetry-clickhouse-headless \
                --user default --password "$ADMIN_PASSWORD" \
                --param_password_hash "$LOOM_PASSWORD_HASH" \
                --multiquery --queries-file /bootstrap/bootstrap.sql
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: admin-password
            - name: LOOM_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: loom-clickhouse-auth
                  key: password-sha256
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: loom-clickhouse-bootstrap
