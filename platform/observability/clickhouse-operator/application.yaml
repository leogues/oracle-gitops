apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  sources:
  - repoURL: oci://ghcr.io/clickhouse/clickhouse-operator-helm
    targetRevision: 0.0.8
    helm:
      releaseName: clickhouse-operator
      valueFiles:
      - $values/platform/observability/clickhouse-operator/values.yaml
    path: .
  - repoURL: https://github.com/leogues/oracle-gitops.git
    targetRevision: main
    ref: values
