fullnameOverride: otel-collector
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
initContainers:
- name: wait-clickhouse
  image: clickhouse/clickhouse-server:26.10.2.103
  command:
  - /bin/bash
  - -ec
  args:
  - "for attempt in $(seq 1 120); do\n  if clickhouse-client --host telemetry-clickhouse-headless --port 9000 --user\
    \ otel --password \"$WRITER_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1; then\n    exit 0\n  fi\n  sleep 5\n\
    done\necho 'ClickHouse bootstrap did not become ready' >&2\nexit 1\n"
  env:
  - name: WRITER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: clickhouse-auth
        key: writer-password
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
presets:
  logsCollection:
    enabled: true
    storeCheckpoints: true
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
service:
  enabled: true
extraEnvs:
- name: CLICKHOUSE_WRITER_PASSWORD
  valueFrom:
    secretKeyRef:
      name: clickhouse-auth
      key: writer-password
extraVolumes:
- name: export-queue
  hostPath:
    path: /var/lib/otelcol-export-queue
    type: DirectoryOrCreate
extraVolumeMounts:
- name: export-queue
  mountPath: /var/lib/otelcol-export-queue
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    file_storage/queue:
      directory: /var/lib/otelcol-export-queue
    basicauth/clickhouse:
      client_auth:
        username: otel
        password: ${env:CLICKHOUSE_WRITER_PASSWORD}
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    file_log:
      include:
      - /var/log/pods/*/*/*.log
      exclude:
      - /var/log/pods/production_*/*/*.log
      - /var/log/pods/monitoring_otel-collector*_*/opentelemetry-collector/*.log
    hostmetrics:
      collection_interval: 60s
    kubeletstats:
      collection_interval: 60s
    prometheus:
      config:
        scrape_configs:
        - honor_labels: true
          sample_limit: 20000
          kubernetes_sd_configs:
          - role: pod
            selectors:
            - role: pod
              field: spec.nodeName=${env:K8S_NODE_NAME}
          metric_relabel_configs:
          - source_labels:
            - namespace
            regex: production
            action: drop
          job_name: kubernetes-pods
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_namespace
            regex: production
            action: drop
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_init
            regex: 'true'
            action: drop
          - source_labels:
            - __meta_kubernetes_pod_container_port_name
            regex: (.*[-_])?metrics|prometheus
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: 'false'
            action: drop
          - source_labels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_pod_name
            regex: argocd;argocd-dex-server-.*
            action: drop
          - source_labels:
            - __meta_kubernetes_pod_container_port_number
            regex: '8443'
            action: drop
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
            - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
            - __meta_kubernetes_pod_node_name
            target_label: node
          - source_labels:
            - __meta_kubernetes_pod_label_cnpg_io_cluster
            target_label: cluster
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: (.+)
            target_label: job
            replacement: $$1
        - honor_labels: true
          sample_limit: 20000
          kubernetes_sd_configs:
          - role: pod
            selectors:
            - role: pod
              field: spec.nodeName=${env:K8S_NODE_NAME}
          metric_relabel_configs:
          - source_labels:
            - namespace
            regex: production
            action: drop
          job_name: infrastructure
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_namespace
            regex: production
            action: drop
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_init
            regex: 'true'
            action: drop
          - source_labels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_pod_name
            - __meta_kubernetes_pod_container_port_number
            regex: cloudflared;cloudflared-.*;|dns;external-dns-.*;7979|longhorn-system;(csi-attacher|csi-provisioner|csi-resizer|csi-snapshotter)-.*;8000|longhorn-system;longhorn-manager-.*;9500|monitoring;grafana-.*;3000|monitoring;.*kube-state-metrics-.*;8080
            action: keep
          - source_labels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_pod_name
            - __address__
            regex: cloudflared;cloudflared-.*;(.+)
            target_label: __address__
            replacement: $$1:2000
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
            - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
            - __meta_kubernetes_pod_node_name
            target_label: node
          - source_labels:
            - __meta_kubernetes_pod_label_cnpg_io_cluster
            target_label: cluster
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: (.+)
            target_label: job
            replacement: $$1
        - honor_labels: true
          sample_limit: 20000
          kubernetes_sd_configs:
          - role: pod
            selectors:
            - role: pod
              field: spec.nodeName=${env:K8S_NODE_NAME}
          metric_relabel_configs:
          - source_labels:
            - namespace
            regex: production
            action: drop
          job_name: secure-controllers
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_namespace
            regex: production
            action: drop
          - source_labels:
            - __meta_kubernetes_pod_phase
            regex: Running
            action: keep
          - source_labels:
            - __meta_kubernetes_pod_container_init
            regex: 'true'
            action: drop
          - source_labels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_container_port_number
            regex: argocd;argocd-image-updater;8443
            action: keep
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
            - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
            - __meta_kubernetes_pod_node_name
            target_label: node
          - source_labels:
            - __meta_kubernetes_pod_label_cnpg_io_cluster
            target_label: cluster
          - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: (.+)
            target_label: job
            replacement: $$1
          scheme: https
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            insecure_skip_verify: true
        - job_name: kubelet-volumes
          scheme: https
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubernetes_sd_configs:
          - role: node
            selectors:
            - role: node
              field: metadata.name=${env:K8S_NODE_NAME}
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_node_name
            target_label: node
          - target_label: metrics_path
            replacement: /metrics
          metric_relabel_configs:
          - source_labels:
            - namespace
            regex: production
            action: drop
          - source_labels:
            - __name__
            regex: kubelet_volume_stats_.*
            action: keep
        - job_name: kubelet
          scheme: https
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          metrics_path: /metrics/cadvisor
          kubernetes_sd_configs:
          - role: node
            selectors:
            - role: node
              field: metadata.name=${env:K8S_NODE_NAME}
          relabel_configs:
          - source_labels:
            - __meta_kubernetes_node_name
            target_label: node
          - target_label: metrics_path
            replacement: /metrics/cadvisor
          metric_relabel_configs:
          - source_labels:
            - namespace
            regex: production
            action: drop
          - source_labels:
            - __name__
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep
        - job_name: otel-collector
          static_configs:
          - targets:
            - ${env:MY_POD_IP}:8888
            labels:
              namespace: monitoring
              pod: ${env:MY_POD_NAME}
  processors:
    # UID injected by the Downward API survives Service routing and proxies.
    k8s_attributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - k8s.deployment.name
        - k8s.node.name
        - k8s.container.name
        - container.image.name
        - container.image.tags
      pod_association:
      - sources:
        - from: resource_attribute
          name: k8s.pod.uid
      - sources:
        - from: connection
    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 80
    resource/cluster:
      attributes:
      - key: k8s.cluster.name
        value: harus
        action: upsert
    transform/services:
      error_mode: ignore
      # The shared chart's app labels describe the chart, so use the workload
      # name and actual image tag for application identity instead.
      log_statements: &service_identity
      - context: resource
        statements:
        - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
        - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] ==
          nil and attributes["k8s.container.name"] != nil
        - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
        - set(attributes["service.version"], attributes["container.image.tags"][0]) where attributes["container.image.tags"] != nil
        - set(attributes["service.instance.id"], Concat([attributes["k8s.pod.uid"], attributes["k8s.container.name"]], "/")) where attributes["k8s.pod.uid"] != nil and attributes["k8s.container.name"] != nil
        - set(attributes["deployment.environment.name"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
      trace_statements: *service_identity
      metric_statements: *service_identity
    deltatocumulative: {}
    batch/metrics:
      send_batch_size: 1024
      timeout: 10s
  exporters:
    clickhouse:
      endpoint: tcp://telemetry-clickhouse-headless.monitoring.svc.cluster.local:9000
      username: otel
      password: ${env:CLICKHOUSE_WRITER_PASSWORD}
      database: otel
      create_schema: true
      ttl: 72h
      sending_queue:
        num_consumers: 1
        queue_size: 1000
        storage: file_storage/queue
        batch:
          min_size: 1000
          flush_timeout: 5s
      retry_on_failure:
        enabled: true
        max_elapsed_time: 0s
    prometheusremotewrite: &remote_write
      endpoint: http://telemetry-clickhouse-headless.monitoring.svc.cluster.local:8123/prometheus/api/v1/write
      auth: &id001
        authenticator: basicauth/clickhouse
      tls: &id002
        insecure: true
      resource_to_telemetry_conversion: &id003
        enabled: true
      remote_write_queue: &id004
        num_consumers: 1
        queue_size: 1000
      retry_on_failure: &id005
        enabled: true
        max_elapsed_time: 0s
    prometheusremotewrite/scraped:
      <<: *remote_write
      translation_strategy: UnderscoreEscapingWithoutSuffixes
  service:
    extensions:
    - health_check
    - file_storage/queue
    - basicauth/clickhouse
    pipelines:
      logs:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - k8s_attributes
        - resource/cluster
        - transform/services
        exporters:
        - clickhouse
      traces:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - k8s_attributes
        - resource/cluster
        - transform/services
        exporters:
        - clickhouse
      metrics:
        receivers:
        - otlp
        processors:
        - memory_limiter
        - k8s_attributes
        - resource/cluster
        - transform/services
        - deltatocumulative
        - batch/metrics
        exporters:
        - prometheusremotewrite
      metrics/scraped:
        receivers:
        - prometheus
        processors:
        - memory_limiter
        - resource/cluster
        - batch/metrics
        exporters:
        - prometheusremotewrite/scraped
    telemetry:
      metrics:
        readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
clusterRole:
  rules:
  - apiGroups:
    - ''
    resources:
    - pods
    - namespaces
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apps
    resources:
    - replicasets
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - nodes
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - nodes/metrics
    verbs:
    - get
  - nonResourceURLs:
    - /metrics
    verbs:
    - get
