data:
  harus-infrastructure.json: '{"uid":"harus-infrastructure","title":"Harus — Infraestrutura","description":"Métricas de infraestrutura coletadas pelo OpenTelemetry Collector e consultadas via PromQL no ClickHouse. Não há coleta de /metrics das aplicações.","schemaVersion":41,"version":1,"tags":["Oracle","OpenTelemetry","ClickHouse"],"timezone":"browser","refresh":"60s","time":{"from":"now-1h","to":"now"},"panels":[{"id":1,"title":"CPU utilizada","type":"stat","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":0,"y":0,"w":6,"h":5},"targets":[{"refId":"A","expr":"1 - avg(rate(system_cpu_time_seconds_total{state=\"idle\"}[5m]))","editorMode":"code","legendFormat":"","range":false,"instant":true}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}},{"id":2,"title":"Memória utilizada","type":"stat","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":6,"y":0,"w":6,"h":5},"targets":[{"refId":"A","expr":"sum(system_memory_usage_bytes{state=\"used\"}) / sum(system_memory_usage_bytes)","editorMode":"code","legendFormat":"","range":false,"instant":true}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}},{"id":3,"title":"Disco raiz utilizado","type":"stat","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":12,"y":0,"w":6,"h":5},"targets":[{"refId":"A","expr":"sum(system_filesystem_usage_bytes{mountpoint=\"/\",state=\"used\"}) / sum(system_filesystem_usage_bytes{mountpoint=\"/\"})","editorMode":"code","legendFormat":"","range":false,"instant":true}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}},{"id":4,"title":"Séries de métricas ativas","type":"stat","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":18,"y":0,"w":6,"h":5},"targets":[{"refId":"A","expr":"count({__name__=~\".+\"})","editorMode":"code","legendFormat":"","range":false,"instant":true}],"fieldConfig":{"defaults":{"unit":"short","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}},{"id":5,"title":"CPU por pod","type":"timeseries","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":0,"y":5,"w":12,"h":10},"targets":[{"refId":"A","expr":"sum by (k8s_namespace_name,k8s_pod_name) (rate(k8s_pod_cpu_time_seconds_total[5m]))","editorMode":"code","legendFormat":"{{k8s_namespace_name}} / {{k8s_pod_name}}","range":true,"instant":false}],"fieldConfig":{"defaults":{"unit":"cores","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}},{"id":6,"title":"Memória por pod","type":"timeseries","datasource":{"type":"prometheus","uid":"clickhouse-prometheus"},"gridPos":{"x":12,"y":5,"w":12,"h":10},"targets":[{"refId":"A","expr":"sum by (k8s_namespace_name,k8s_pod_name) (k8s_pod_memory_working_set_bytes)","editorMode":"code","legendFormat":"{{k8s_namespace_name}} / {{k8s_pod_name}}","range":true,"instant":false}],"fieldConfig":{"defaults":{"unit":"bytes","decimals":2},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]},"tooltip":{"mode":"multi","sort":"desc"}}}],"templating":{"list":[]}}'
